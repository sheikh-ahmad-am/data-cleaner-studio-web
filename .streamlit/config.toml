[server]
headless = true
port = 8501
maxUploadSize = 1000

# Classic light theme: warm off-white background, ink text, one deep-teal
# accent. This themes the whole app from first paint — login screen
# included — so the app never follows the browser/OS dark mode, and every
# primary button is teal instead of Streamlit's default red.
[theme]
base = "light"
backgroundColor = "#FAF7F2"
secondaryBackgroundColor = "#F3EFE8"
textColor = "#23272E"
primaryColor = "#2F5D5A"
font = "sans serif"
